<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClimaFit WeatherApp</title>
    <script src="script.js" script type="module"></script>
    <link rel="stylesheet" href="styles.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Manrope:wght@200..800&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300;1,300&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="search-container">
      <input type="text" id="cityInput" placeholder="Please Enter city" />
      <div class="buttons">
        <button class="searchBtn">Search</button>
        <button class="locBtn">My Location</button>
      </div>
    </div>
    <div class="weather-section"></div>
    <img src="logo.png" class="app-logo" />
    <p class="app-desc">
      A responsive weather application that provides real-time weather and
      personalized clothing recommendations based on the current weather
      conditions.
      <strong
        >Before starting please only use the comma(,) special character</strong
      >
    </p>
    <div class="info-section"></div>
    <div class="dailytemp-section"></div>
  </body>
</html>
